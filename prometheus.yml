global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "windows-exporter"
    static_configs:
      - targets:
          - "192.168.1.215:9182"
  - job_name: "prombridge_receiver"
    static_configs:
      - targets:
          - "prombridge_receiver:8080"
  - job_name: prombridge_sender
    static_configs:
      - targets:
          - "prombridge-agent:9091"
  - job_name: "custom-exporter"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "stress-exporter:9183"