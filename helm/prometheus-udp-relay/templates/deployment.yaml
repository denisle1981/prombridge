apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pur.fullname" . }}
  labels:
    {{- include "pur.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pur.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pur.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: receiver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --udp-listen=:{{ .Values.receiver.udpPort }}
            - --http-listen=:{{ .Values.receiver.httpPort }}
            - --reassembly-timeout={{ .Values.receiver.reassemblyTimeout }}
            - {{ printf "--max-compressed-bytes=%d" (int64 .Values.receiver.maxCompressedBytes) | quote }}
            - {{ printf "--max-uncompressed-bytes=%d" (int64 .Values.receiver.maxUncompressedBytes) | quote }}
            - {{ printf "--max-packet-bytes=%d" (int64 .Values.receiver.maxPacketBytes) | quote }}
            - {{ printf "--udp-receive-buffer-bytes=%d" (int64 .Values.receiver.udpReceiveBufferBytes) | quote }}
            - --preserve-source-timestamps={{ .Values.receiver.preserveSourceTimestamps }}
          env:
            - name: PUR_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "pur.fullname" .) .Values.secret.existingSecret }}
                  key: {{ .Values.secret.key }}
          ports:
            - name: udp
              containerPort: {{ .Values.receiver.udpPort }}
              protocol: UDP
            - name: metrics
              containerPort: {{ .Values.receiver.httpPort }}
              protocol: TCP
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
          readinessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources: {{ toYaml .Values.resources | nindent 12 }}
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
